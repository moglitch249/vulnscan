[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnscanner"
version = "0.1.0"
description = "Production-quality vulnerability assessment and intelligence automation framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Security Research Team" },
]
keywords = ["security", "vulnerability", "scanner", "cve", "cpe", "assessment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

dependencies = [
    # CLI
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",

    # Async HTTP
    "httpx>=0.27,<1.0",
    "aiohttp>=3.10,<4.0",

    # Configuration
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",

    # Database
    "aiosqlite>=0.20,<1.0",

    # XML parsing (Nmap output, advisories) — using stdlib + defusedxml (no C compiler needed)
    "defusedxml>=0.7,<1.0",

    # Networking / validation
    "ipaddress",           # stdlib but explicit
    "validators>=0.28,<1.0",
    "dnspython>=2.6,<3.0",

    # Data processing
    "jinja2>=3.1,<4.0",   # HTML report templating
    "tabulate>=0.9,<1.0", # CLI table output
    "packageurl-python>=0.15,<1.0",  # PURL support

    # Rate limiting
    "aiolimiter>=1.1,<2.0",

    # Logging
    "structlog>=24.0,<26.0",

    # Version comparison
    "packaging>=24.0,<26.0",

    # Fuzzy matching (for CPE/fingerprint normalization)
    "thefuzz>=0.22,<1.0",
    "python-Levenshtein>=0.25,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "respx>=0.21,<1.0",       # httpx mock
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
]

postgres = [
    "asyncpg>=0.29,<1.0",
]

[project.scripts]
vulnscan = "vulnscanner.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S603",  # subprocess calls (we validate inputs)
    "S607",  # partial executable path (nmap etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]
